const allC=()=>BUILTIN.map(o=>o.id=='s3'?{...o,nom:sigle()+' (sans mention)'}:o).concat(DB.set.cachets||[]);
const sigle=()=>(DB.set.sigle||'').trim().toUpperCase()||String(DB.set.nom||'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,4).toUpperCase()||'LOG';
const slug=()=>String(DB.set.nom||'logiciel').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'logiciel';
const THEMES=[['Vert (origine)','#1b7a3a','#0f5a2a','#f5c518'],['Bleu','#1d5fb4','#123e7c','#ffc83d'],['Rouge','#c0272d','#8e1a1f','#ffd23f'],['Violet','#6a3fb5','#46257f','#ffd23f'],['Orange','#d9640a','#9c4505','#ffe066'],['Turquoise','#0b8a8f','#06595c','#ffd23f'],['Ardoise','#37474f','#1c2a30','#f5c518']];
const hx=c=>{c=String(c||'').replace('#','');if(c.length==3)c=c.replace(/./g,'$&$&');return[0,2,4].map(i=>parseInt(c.substr(i,2),16)||0)};
const mixw=(c,t)=>'#'+hx(c).map(v=>Math.round(v+(255-v)*t).toString(16).padStart(2,'0')).join('');
const lum=c=>{const[r,g,b]=hx(c);return(.299*r+.587*g+.114*b)/255};
const curT=()=>Object.assign({g:'#1b7a3a',g2:'#0f5a2a',y:'#f5c518'},DB.set.theme||{});
function applyTheme(){const T=curT(),r=document.documentElement.style;r.setProperty('--g',T.g);r.setProperty('--g2',T.g2);r.setProperty('--y',T.y);r.setProperty('--bd',T.g2);r.setProperty('--yt',lum(T.y)>.6?'#1b2a0f':'#fff');r.setProperty('--gl',mixw(T.g,.82))}
function setTheme(i){const t=THEMES[i];if(i==0)delete DB.set.theme;else DB.set.theme={g:t[1],g2:t[2],y:t[3]};save();applyTheme();go('set',1)}
function themeCustom(){form('Couleurs du logiciel',[['g','Couleur principale (en-tête, boutons)','color'],['g2','Couleur foncée (titres, bordures)','color'],['y','Couleur d’accent (menu actif, surbrillance)','color']],curT(),r=>{DB.set.theme={g:r.g,g2:r.g2,y:r.y};save();applyTheme();closeM();go('set',1);if(lum(r.g)>.75||lum(r.g2)>.6)toast('Couleur très claire : le texte blanc sera peu lisible')})}
const themeSec=()=>{const T=curT();return`<h3>🎨 Couleurs du logiciel</h3><p class="mu">Choisissez un thème ou personnalisez les couleurs. Le changement s’applique tout de suite à tout le logiciel (les factures imprimées gardent leurs couleurs).</p><div class="row" style="margin:8px 0">${THEMES.map((t,i)=>{const on=T.g==t[1]&&T.g2==t[2]&&T.y==t[3];return`<button class="b2" style="display:flex;align-items:center;gap:8px;${on?'background:var(--y);color:var(--yt);font-weight:800':''}" onclick="setTheme(${i})"><i style="display:inline-block;width:40px;height:22px;border-radius:6px;border:1px solid #0005;background:linear-gradient(90deg,${t[2]} 0 34%,${t[1]} 34% 67%,${t[3]} 67%)"></i>${t[0]}${on?' ✓':''}</button>`}).join('')}</div><div class="row"><button class="b" onclick="themeCustom()">🎨 Personnaliser les couleurs</button><button class="b2" onclick="setTheme(0)">↺ Couleurs d’origine</button></div>`};
function applyBrand(){const nm=String(DB.set.nom||'').trim()||'Logiciel',sg=sigle();document.title=sg+' – '+nm;[['lg1',sg],['lg2',sg],['tnm',nm.toUpperCase()],['lnm',nm.toUpperCase()]].forEach(([i,v])=>{const e=document.getElementById(i);if(e)e.textContent=v})}
const stDef=()=>{const S=DB.set,ini=String(S.nom||'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,4).toUpperCase();return{cth:String(S.nom||'').toUpperCase(),ctb:S.tel?'Téléphone : '+S.tel:'',ctc:ini,ctm1:'',ctm2:''}};
const stInfo=()=>{const S=DB.set,D=stDef();return{h:S.cth??D.cth,b:S.ctb??D.ctb,c:S.ctc??D.ctc,m1:S.ctm1??D.ctm1,m2:S.ctm2??D.ctm2}};
const UN0=['Pièce','Sac','Kg','Tonne','Mètre','m²','m³','Litre','Carton','Boîte','Paquet','Barre','Rouleau','Seau','Lot','Palette'],CT0=['Ciment','Fer','Peinture','Plomberie','Électricité','Carrelage','Outillage','Divers'];
function lst(k){const S=DB.set;if(S[k])return S[k];if(k=='units')return UN0.slice();const ex=[...new Set((DB.produits||[]).map(p=>String(p.cat||'').trim()).filter(Boolean))];return CT0.concat(ex.filter(x=>!CT0.includes(x)))}
function lad(k){const e=document.getElementById('ln_'+k),v=(e.value||'').trim();if(!v)return;const L=lst(k);if(L.some(x=>x.toLowerCase()==v.toLowerCase()))return toast('Déjà dans la liste');DB.set[k]=L.concat([v]);save();go('set')}
function ldl(k,i){const L=lst(k);L.splice(i,1);DB.set[k]=L;save();go('set')}
function lrs(k){ask('Remettre la liste par défaut ?',()=>{delete DB.set[k];save();go('set')})}

function rfile(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>{const t=r.result;try{const o=JSON.parse(t);if(!Array.isArray(o.docs)||!Array.isArray(o.produits))throw 0}catch(e){return toast('Fichier invalide : choisissez une sauvegarde de ce logiciel (.json)')}ask('Remplacer toutes les données actuelles par le fichier « '+esc(f.name)+' » ?',()=>rest(t))};r.readAsText(f)}
function bk(){return head('💾 Sauvegarde JSON','<button class="b" onclick="dlj(JSON.stringify(DB),bname())">⬇ Télécharger la sauvegarde (.json)</button><button class="b2" onclick="document.getElementById(\'bkf\').click()">📂 Restaurer depuis un fichier .json</button><input id="bkf" type="file" accept=".json,application/json" style="display:none" onchange="rfile(this)">')+'<p class="mu">Le fichier .json contient toutes vos données (clients, produits, factures, stocks, charges, dépôts, prêts, utilisateurs, paramètres et cachets). Téléchargez-le régulièrement et conservez-le en lieu sûr (clé USB, e-mail, cloud). Les données actuelles sont : '+Math.round(JSON.stringify(DB).length/1024)+' Ko.</p><h3>Points de sauvegarde dans ce navigateur</h3><div class="row" style="margin-bottom:8px"><button class="b2" onclick="mk()">+ Point de sauvegarde</button></div>'+tbl(['Date','Taille',''],bks().map((b,i)=>[b.d,Math.round(b.s.length/1024)+' Ko',`<span class="act"><button class="b2" onclick="ask('Restaurer ce point ? Les données actuelles seront remplacées.',()=>rest(bks()[${i}].s))">Restaurer</button><button class="b2" onclick="dlj(bks()[${i}].s,'sauvegarde-'+slug()+'-'+bks()[${i}].d.replace(/[^0-9]+/g,'-')+'.json')">⬇ .json</button></span>`]))}
function set(){const S=DB.set;return head('⚙️ Paramètres',`<button class="b" onclick="setf()">Modifier</button>`)+tbl(['Paramètre','Valeur'],[['Nom du logiciel / entreprise',esc(S.nom)],['Sigle du logo',esc(sigle())],['Activité',esc(S.act||'')||'—'],['Téléphone',esc(S.tel)],['Adresse',esc(S.adr)],['NINEA',esc(S.ninea||'')||'—'],['RC (Registre du commerce)',esc(S.rc||'')||'—'],['Devise',esc(S.dev)],['TVA par défaut',S.tva+' %'],['Pied de document',esc(S.pied)],['Logo',S.logo?`<img class="th" src="${S.logo}">`:'—']])+`<h3>📋 Listes des produits</h3><p class="mu">Ces listes apparaissent dans le formulaire d’un produit (Unité et Catégorie).</p>${lbox('units','Unités')}${lbox('cats','Catégories')}${themeSec()}<h3>🔏 Informations des cachets</h3><div class="row" style="align-items:center"><div style="width:130px">${gst('',0,'r',['PAYÉ','ET LIVRÉ'])}</div><div><button class="b" onclick="cachf()">Modifier les informations des cachets</button><p class="mu" style="margin:6px 0 0">Tous vos cachets (Payé, Payé et livré, Payé et non livré, Livré et non payé, sans mention) se mettent à jour avec ces informations.</p></div></div><br><button class="bd" onclick="ask('⚠ Effacer TOUTES les données ? Cette action est irréversible : pensez à télécharger une sauvegarde JSON avant.',()=>{DB=def();save();applyTheme();applyBrand();go('dash')})">⚠ Réinitialiser toutes les données</button>`}
function cachf(){const I=stInfo();form('Informations du cachet',[['cth','Texte en haut (arc), ex : nom de l’entreprise'],['ctc','Texte au centre (ex : initiales)'],['ctb','Texte en bas (arc), ex : Téléphone : 70 000 00 00']],{cth:I.h,ctc:I.c,ctb:I.b},r=>{const D=stDef();for(const k in D){if(!(k in r))continue;if(r[k]===D[k])delete DB.set[k];else DB.set[k]=r[k]}save();closeM();go('set')})}
function setf(){form('Paramètres',[['nom','Nom du logiciel / de l’entreprise (affiché partout)'],['sigle','Sigle du logo (ex : SJM) — vide = automatique'],['act','Activité (ex : Vente de matériaux de construction)'],['tel','Téléphone'],['adr','Adresse'],['ninea','NINEA'],['rc','RC (Registre du commerce)'],['dev','Devise'],['tva','TVA par défaut (%)','number'],['pied','Pied de document'],['logo','Logo de l’entreprise (facture)','img']],DB.set,r=>{if(!String(r.nom||'').trim())return toast('Le nom du logiciel est requis');r.nom=r.nom.trim();r.sigle=(r.sigle||'').trim().toUpperCase();const ch=r.nom!==DB.set.nom||r.tel!==DB.set.tel;Object.assign(DB.set,r);if(ch)DB.set.cust=1;applyBrand();save();closeM();go('set')})}

const dk=x=>x.tid||('x:'+(x.compte||'—')),dpN=k=>find('clients',k)?.nom||(String(k).startsWith('x:')?String(k).slice(2):'—');
function dpK(){const m={},g=k=>m[k]=m[k]||{k,i:0,o:0,u:0};DB.depots.forEach(x=>{const e=g(dk(x));if(x.type=='Dépôt')e.i+=n(x.montant);else e.o+=n(x.montant)});DB.docs.filter(d=>d.type=='facture'&&d.tid).forEach(d=>(d.pay||[]).forEach(p=>{if(p.m=='Dépôt')g(d.tid).u+=n(p.a)}));Object.values(m).forEach(e=>e.s=e.i-e.o-e.u);return m}
const dpS=t=>(dpK()[t]||{s:0}).s;
function dpf(t,tid,id){const o=id?find('depots',id):{date:today(),tid:tid||''};if(id&&!o.tid&&o.compte)o.nv=o.compte;
form((id?'Modifier · ':'')+(t=='Dépôt'?'Dépôt d’argent reçu':'Retrait d’argent'),[['date','Date','date'],['tid','Tiers (client)','sel','clients'],['nv','Ou nouveau tiers (nom)'],['montant','Montant','number'],['note','Notes']],o,r=>{
let k=r.tid;const nv=(r.nv||'').trim();if(!k&&nv){const c=DB.clients.find(x=>x.nom.toLowerCase()==nv.toLowerCase())||(DB.clients.push({id:uid(),nom:nv,tel:'',adr:''}),DB.clients[DB.clients.length-1]);k=c.id}
if(!k)return toast('Choisissez le tiers ou saisissez un nouveau nom');if(r.montant<=0)return toast('Saisissez un montant');
if(t!='Dépôt'){const sd=dpS(k)+(id&&o.type!='Dépôt'&&o.tid==k?n(o.montant):0);if(r.montant>sd)return toast('Retrait supérieur au solde ('+fmt(sd)+')')}
const rec={date:r.date,tid:k,montant:r.montant,note:r.note};if(id){Object.assign(o,rec);delete o.nv;delete o.compte}else DB.depots.push({id:uid(),type:t,...rec});save();closeM();toast(t=='Dépôt'?'Dépôt enregistré':'Retrait enregistré');go('depots',1)})}
function dpAch(k){CM='Dépôt';CART=[];CC=k;CR='';PT='facture';window._keep=1;go('vr');window._keep=0}
function dep(){const K=dpK(),f=k=>dpN(k).toLowerCase().includes(Q.toLowerCase()),ks=Object.keys(K).filter(f).sort((a,b)=>dpN(a).localeCompare(dpN(b)));
const mv=[...DB.depots.map(x=>({d:x.date,k:dk(x),t:x.type=='Dépôt'?'Dépôt':'Retrait',a:n(x.montant),nt:x.note||'',id:x.id,i:x.type=='Dépôt'})),...DB.docs.filter(d=>d.type=='facture'&&d.tid).flatMap(d=>(d.pay||[]).filter(p=>p.m=='Dépôt').map(p=>({d:p.date||d.date,k:d.tid,t:'Achat de produits',a:n(p.a),nt:'Facture '+d.num,doc:d.id})))].filter(x=>f(x.k)).sort((a,b)=>String(b.d).localeCompare(String(a.d)));
const R=r=>r<0?`<b class="low">${fmt(r)}</b>`:`<b>${fmt(r)}</b>`;
return head('🏦 Dépôts d’argent',srch()+`<button class="b" onclick="dpf('Dépôt')">+ Nouveau dépôt</button><button class="b2" onclick="dpf('Retrait')">💵 Retrait</button>`)+'<p class="mu">Argent confié par des tiers. Ils le récupèrent soit par retrait, soit en achetant des produits (mode de paiement « Dépôt »).</p>'
+`<div class="kp">${kpi('Argent confié (solde total)',fmt(sum(ks,k=>K[k].s)))}${kpi('Total déposé',fmt(sum(ks,k=>K[k].i)))}${kpi('Total retiré',fmt(sum(ks,k=>K[k].o)))}${kpi('Utilisé en achats',fmt(sum(ks,k=>K[k].u)))}</div>`
+'<h3>Solde par tiers</h3>'+tbl(['Tiers','Déposé','Retrait','Achats','Solde',''],ks.map(k=>{const e=K[k],c=!String(k).startsWith('x:');return[esc(dpN(k)),fmt(e.i),fmt(e.o),fmt(e.u),R(e.s),c?`<span class="act"><button class="b2" onclick="dpf('Dépôt','${k}')">+ Dépôt</button><button class="b2" onclick="dpf('Retrait','${k}')">💵 Retrait</button>${e.s>0?`<button class="b2" onclick="dpAch('${k}')">🛒 Acheter</button>`:''}</span>`:'']}))
+'<h3>Mouvements</h3>'+tbl(['Date','Tiers','Opération','Montant','Détails',''],mv.map(x=>[x.d,esc(dpN(x.k)),`<span class="pill ${x.i?'ok':'wa'}">${x.t}</span>`,(x.i?'+ ':'− ')+fmt(x.a),esc(x.nt),x.doc?`<button class="b2" onclick="pv('${x.doc}')">👁</button>`:`<span class="act"><button class="b2" onclick="dpf('${x.t=='Dépôt'?'Dépôt':'Retrait'}','','${x.id}')">✎</button><button class="b2" onclick="del('depots','${x.id}')">🗑</button></span>`]))}
const NAV=[['dash','Tableau de bord','🏠','AVC'],['vr','Vente rapide','⚡','AV'],['clients','Clients','👥','AVC'],['fournisseurs','Fournisseurs','🚚','AC'],['produits','Produits & stocks','📦','AVC'],['rap','Ré-approvisionner','🔄','AC'],['facture','Factures','🧾','AVC'],['proforma','Factures proforma','📄','AV'],['bc','Bons de commande','📝','AC'],['bl','Bons de livraison','🚛','AV'],['devis','Devis','💬','AV'],['charges','Charges & dépenses','💸','AC'],['prets','Prêts & emprunts','🤝','AC'],['depots','Dépôts d’argent','🏦','AC'],['rep','Rapports','📊','AC'],['cach','Cachets','🔏','A'],['users','Utilisateurs','🔐','A'],['bk','Sauvegardes','💾','A'],['set','Paramètres','⚙️','A']];
const VW={dash,vr,rap,rep,bk,set,cach};['clients','fournisseurs','produits','charges','prets','depots','users'].forEach(k=>VW[k]=()=>crud(k));Object.keys(DT).forEach(t=>VW[t]=()=>dl(t));VW.depots=dep;
function myPin(){const u=find('users',SES.g());form('Changer mon code PIN',[['old','Code actuel','pin'],['nw','Nouveau code (4 chiffres)','pin'],['cf','Confirmer le nouveau code','pin']],{},r=>{if(r.old!=u.pin)return toast('Code actuel incorrect');if(!/^\d{4}$/.test(r.nw))return toast('Le code doit contenir exactement 4 chiffres');if(DB.users.some(x=>x.pin==r.nw&&x.id!=u.id))return toast('Ce code est déjà pris : choisissez-en un autre');if(r.nw!=r.cf)return toast('Les deux codes sont différents');u.pin=r.nw;u.maj=0;save();closeM();toast('Code modifié');go(V,1)})}
function go(v,k){if(!k)Q='';if(v=='vr'&&!k&&!window._keep)PT='facture';if(v!='vr'&&PT!='facture')PT='facture';V=v;const u=find('users',SES.g());if(!u)return;
$('#side').innerHTML=NAV.filter(x=>x[3].includes(u.role[0])).map(x=>`<button class="${x[0]==v?'on':''}" onclick="go('${x[0]}')">${x[2]} ${x[1]}</button>`).join('');
$('#main').innerHTML=VW[v]();if(k===2){const s=$('.s');if(s){s.focus();s.setSelectionRange(999,999)}}if(!k){$('#side').classList.remove('open');scrollTo(0,0)}}
let FAIL=0,LOCK=0;
function login(){if(Date.now()<LOCK){$('#pw').value='';dots();return toast('Trop d’essais : patientez '+Math.ceil((LOCK-Date.now())/1000)+' s')}const u=DB.users.find(x=>x.pin==$('#pw').value);if(!u){$('#pw').value='';dots();const b=$('#login .box');b.classList.remove('err');void b.offsetWidth;b.classList.add('err');if(++FAIL>=5){FAIL=0;LOCK=Date.now()+30000;return toast('Trop d’essais : attendez 30 secondes')}return toast('Code incorrect')}FAIL=0;$('#pw').value='';dots();SES.s(u.id);window._u=u.id;start();if(u.maj)setTimeout(()=>{toast('Pensez à changer votre code (bouton 🔑)')},400)}
function logout(){SES.s(null);window._u=null;start()}
function dots(){document.querySelectorAll('#dots i').forEach((e,k)=>e.classList.toggle('f',k<$('#pw').value.length))}
function kp(d){const i=$('#pw');if(d=='<')i.value=i.value.slice(0,-1);else if(i.value.length<4)i.value+=d;dots();if(i.value.length==4)setTimeout(login,150)}
document.addEventListener('keydown',e=>{if($('#login').classList.contains('off')||e.ctrlKey||e.metaKey)return;if(/^\d$/.test(e.key))kp(e.key);else if(e.key=='Backspace')kp('<')});
function start(){applyBrand();applyTheme();const u=find('users',SES.g());if(!u){SES.s(null);$('#login').classList.remove('off');$('#pw').value='';dots();$('#usr').innerHTML='';$('#side').innerHTML='';$('#main').innerHTML='';closeM();return}
$('#login').classList.add('off');$('#usr').innerHTML=`<span style="font-weight:600">${esc(u.nom)}</span> <button onclick="myPin()" title="Changer mon code">🔑</button> <button onclick="logout()" title="Se déconnecter">⏻</button>`;go('dash')}
start();
</script></body></html>
